# Lightweight local Airflow environment for validating the included DAG.
# Start with: docker compose -f docker-compose.airflow.yaml up airflow
services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      PYTHONPATH: /opt/recommendation-pipeline
      RECOMMENDATION_PROJECT_DIR: /opt/recommendation-pipeline
    ports:
      - '8080:8080'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/recommendation-pipeline
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
